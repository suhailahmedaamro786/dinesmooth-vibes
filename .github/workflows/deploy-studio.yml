name: Deploy D-Pizza Sanity Studio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - ".github/workflows/deploy-studio.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Deploy Studio to Sanity Hosting
        run: npx sanity@latest deploy --yes --auto-updates --schema-required --url d-pizza-menu
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
